name: Deploy Liga Web

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Cargar variables del servidor
        run: |
          ENV_FILE=/home/ubuntu/liga-web/.env
          if [ -f "$ENV_FILE" ]; then
            set -a
            . "$ENV_FILE"
            set +a
            {
              echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
              echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
              echo "SUPABASE_DB_URL=$SUPABASE_DB_URL"
              echo "SUPERADMIN_EMAILS=$SUPERADMIN_EMAILS"
            } >> "$GITHUB_ENV"
            echo "Variables cargadas desde $ENV_FILE"
          else
            echo "::warning::$ENV_FILE no existe. Se hace build sin credenciales; el contenedor NO va a levantar hasta que lo crees."
          fi

      - name: Chequear credenciales de build
        run: |
          KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          echo "URL  = $NEXT_PUBLIC_SUPABASE_URL"
          echo "KEY  len=${#KEY} prefijo=${KEY:0:12}"
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$KEY" ]; then
            echo "::error::Falta la URL o la key pública de Supabase en /home/ubuntu/liga-web/.env"
            exit 1
          fi

      - name: Migrar base de datos (idempotente)
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL no seteado en el .env del servidor; salto la migración."
            exit 0
          fi
          run_psql() {
            sudo docker run --rm -i -v "$PWD/supabase:/sql" postgres:16 \
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 "$@"
          }
          for f in supabase/migrations/*.sql; do
            echo "── aplicando ${f}"
            run_psql -f "/sql/migrations/$(basename "$f")"
          done
          # Sembrar superadmins desde el .env (lista separada por comas)
          if [ -n "$SUPERADMIN_EMAILS" ]; then
            IFS=',' read -ra _EM <<< "$SUPERADMIN_EMAILS"
            for e in "${_EM[@]}"; do
              e="$(echo "$e" | tr -d '[:space:]')"
              [ -z "$e" ] && continue
              echo "── superadmin: $e"
              run_psql -c "insert into public.superadmins(email) values (lower('$e')) on conflict do nothing;"
            done
          fi

      - name: Build imagen
        run: |
          sudo docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -t liga-web:latest .

      - name: Levantar contenedor
        run: |
          sudo docker compose down
          sudo docker compose up -d

      - name: Limpiar imágenes viejas
        if: always()
        run: sudo docker image prune -f

      - name: Verificar
        run: sudo docker compose ps --format table
